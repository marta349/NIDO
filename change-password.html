<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Cambiar contraseña de la cuenta NIDO"
>

<title>Cambiar contraseña — NIDO</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>


<body class="dashboard-page">


<!-- =====================================================
     CABECERA
====================================================== -->

<header class="dashboard-header">

    <div>

        <p class="dashboard-welcome">
            NIDO
        </p>

        <h1>
            Cambiar contraseña
        </h1>

    </div>


    <div class="dashboard-logo">
        NIDO
    </div>

</header>


<!-- =====================================================
     CONTENIDO
====================================================== -->

<main class="dashboard-content">


    <!-- =================================================
         INTRODUCCIÓN
    ================================================== -->

    <section class="change-password-intro">

        <h2>
            Actualiza tu contraseña
        </h2>

        <p>
            Utiliza una contraseña segura que puedas recordar
            fácilmente.
        </p>

    </section>


    <!-- =================================================
         FORMULARIO
    ================================================== -->

    <section class="change-password-card">

        <form id="changePasswordForm">


            <!-- CONTRASEÑA ACTUAL -->

            <div class="change-password-group">

                <label for="currentPassword">
                    Contraseña actual
                </label>


                <div class="password-input-wrapper">

                    <input
                        type="password"
                        id="currentPassword"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        data-target="currentPassword"
                        aria-label="Mostrar contraseña"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- NUEVA CONTRASEÑA -->

            <div class="change-password-group">

                <label for="newPassword">
                    Nueva contraseña
                </label>


                <div class="password-input-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        data-target="newPassword"
                        aria-label="Mostrar contraseña"
                    >
                        👁️
                    </button>

                </div>


                <small class="change-password-help">
                    Debe tener al menos 8 caracteres.
                </small>

            </div>


            <!-- REPETIR CONTRASEÑA -->

            <div class="change-password-group">

                <label for="confirmPassword">
                    Repetir nueva contraseña
                </label>


                <div class="password-input-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="Mostrar contraseña"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- MENSAJE -->

            <div
                id="changePasswordMessage"
                class="change-password-message"
                hidden
            ></div>


            <!-- BOTONES -->

            <div class="change-password-actions">

                <button
                    type="submit"
                    class="primary-button"
                >
                    Cambiar contraseña
                </button>


                <button
                    type="button"
                    id="cancelChangePassword"
                    class="secondary-button"
                >
                    Cancelar
                </button>

            </div>


        </form>

    </section>


    <!-- =================================================
         INFORMACIÓN
    ================================================== -->

    <section class="change-password-info">

        <div class="change-password-info-icon">
            🛡️
        </div>


        <div>

            <strong>
                Consejo de seguridad
            </strong>

            <p>
                No compartas tu contraseña y evita utilizar
                la misma contraseña en diferentes servicios.
            </p>

        </div>

    </section>


</main>


<!-- =====================================================
     NAVEGACIÓN
====================================================== -->

<nav class="bottom-navigation">


    <button
        class="nav-item"
        type="button"
        data-page="dashboard"
    >

        <span class="nav-icon">
            ⌂
        </span>

        <span>
            Inicio
        </span>

    </button>


    <button
        class="nav-item"
        type="button"
        data-page="movements"
    >

        <span class="nav-icon">
            ↕
        </span>

        <span>
            Movimientos
        </span>

    </button>


    <button
        class="nav-item"
        type="button"
        data-page="goals"
    >

        <span class="nav-icon">
            ◎
        </span>

        <span>
            Objetivos
        </span>

    </button>


    <button
        class="nav-item active"
        type="button"
        data-page="more"
    >

        <span class="nav-icon">
            ☰
        </span>

        <span>
            Más
        </span>

    </button>


</nav>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="js/change-password.js"></script>


</body>

</html>
