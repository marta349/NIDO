<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Añadir gasto — NIDO"
    >

    <title>Añadir gasto — NIDO</title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <main class="transaction-page">


        <section class="transaction-card">


            <!-- VOLVER -->

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ← Volver
            </button>


            <!-- LOGO -->

            <div class="auth-logo">
                NIDO
            </div>


            <!-- ICONO -->

            <div class="transaction-icon expense-transaction-icon">
                −
            </div>


            <!-- TÍTULO -->

            <h1>
                Añadir gasto
            </h1>


            <p class="auth-description">

                Registra un dinero que ha salido de tu NIDO.

            </p>


            <!-- FORMULARIO -->

            <form
                id="expenseForm"
            >


                <!-- CONCEPTO -->

                <div class="form-group">

                    <label for="expenseConcept">
                        Concepto
                    </label>

                    <input
                        type="text"
                        id="expenseConcept"
                        placeholder="Ej. Compra supermercado"
                        maxlength="60"
                        required
                    >

                </div>


                <!-- CANTIDAD -->

                <div class="form-group">

                    <label for="expenseAmount">
                        Cantidad
                    </label>

                    <div class="amount-input">

                        <input
                            type="number"
                            id="expenseAmount"
                            placeholder="0,00"
                            min="0.01"
                            step="0.01"
                            required
                        >

                        <span>
                            €
                        </span>

                    </div>

                </div>


                <!-- CATEGORÍA -->

                <div class="form-group">

                    <label for="expenseCategory">
                        Categoría
                    </label>

                    <select
                        id="expenseCategory"
                        required
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Selecciona una categoría
                        </option>

                        <option value="vivienda">
                            Vivienda
                        </option>

                        <option value="alimentacion">
                            Alimentación
                        </option>

                        <option value="transporte">
                            Transporte
                        </option>

                        <option value="servicios">
                            Servicios
                        </option>

                        <option value="ocio">
                            Ocio
                        </option>

                        <option value="otro">
                            Otro
                        </option>

                    </select>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="primary-button auth-button"
                >
                    AÑADIR GASTO
                </button>


            </form>


        </section>


    </main>


<script src="js/nido-storage.js"></script>
<script src="js/add-expense.js"></script>


</body>

</html>
