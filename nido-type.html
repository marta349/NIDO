<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Elige el tipo de NIDO"
    >

    <title>Tu NIDO — NIDO</title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <main class="nido-type-page">


        <section class="nido-type-card">


            <!-- LOGO -->

            <div class="auth-logo">
                NIDO
            </div>


            <!-- TÍTULO -->

            <h1>
                ¿Qué tipo de NIDO quieres?
            </h1>


            <p class="auth-description">

                Elige cómo vas a utilizar tu espacio
                compartido.

            </p>


            <!-- OPCIONES -->

            <div class="nido-options">


                <!-- PAREJA -->

                <button
                    class="nido-option"
                    data-type="pareja"
                    type="button"
                >

                    <span class="nido-option-icon">
                        ❤️
                    </span>

                    <span class="nido-option-content">

                        <strong>
                            Pareja
                        </strong>

                        <small>
                            Gestionad vuestras finanzas juntos.
                        </small>

                    </span>

                    <span class="nido-option-arrow">
                        →
                    </span>

                </button>


                <!-- FAMILIA -->

                <button
                    class="nido-option"
                    data-type="familia"
                    type="button"
                >

                    <span class="nido-option-icon">
                        👨‍👩‍👧
                    </span>

                    <span class="nido-option-content">

                        <strong>
                            Familia
                        </strong>

                        <small>
                            Organizad los gastos del hogar.
                        </small>

                    </span>

                    <span class="nido-option-arrow">
                        →
                    </span>

                </button>


                <!-- EMPRESA -->

                <button
                    class="nido-option"
                    data-type="empresa"
                    type="button"
                >

                    <span class="nido-option-icon">
                        🏢
                    </span>

                    <span class="nido-option-content">

                        <strong>
                            Empresa
                        </strong>

                        <small>
                            Gestiona las finanzas de tu empresa.
                        </small>

                    </span>

                    <span class="nido-option-arrow">
                        →
                    </span>

                </button>


                <!-- EQUIPO -->

                <button
                    class="nido-option"
                    data-type="equipo"
                    type="button"
                >

                    <span class="nido-option-icon">
                        👥
                    </span>

                    <span class="nido-option-content">

                        <strong>
                            Equipo / Proyecto
                        </strong>

                        <small>
                            Controlad los gastos de un proyecto.
                        </small>

                    </span>

                    <span class="nido-option-arrow">
                        →
                    </span>

                </button>


            </div>


            <!-- VOLVER -->

            <button
                id="backToRegister"
                class="back-button"
                type="button"
            >
                ← Volver
            </button>


        </section>


    </main>


    <script
        src="js/nido-type.js"
    ></script>


</body>

</html>
