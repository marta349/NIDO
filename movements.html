<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Movimientos — NIDO"
    >

    <title>Movimientos — NIDO</title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <main class="movements-page">


        <!-- =================================================
             CABECERA
        ================================================== -->

        <header class="page-header">


            <div>

                <span class="section-kicker">
                    NIDO
                </span>

                <h1>
                    Movimientos
                </h1>

            </div>


            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ← Inicio
            </button>


        </header>


        <!-- =================================================
             RESUMEN
        ================================================== -->

        <section class="movement-summary">


            <div>

                <span>
                    Ingresos
                </span>

                <strong
                    id="movementIncome"
                    class="summary-income"
                >
                    +0,00 €
                </strong>

            </div>


            <div>

                <span>
                    Gastos
                </span>

                <strong
                    id="movementExpense"
                    class="summary-expense"
                >
                    -0,00 €
                </strong>

            </div>


            <div>

                <span>
                    Balance
                </span>

                <strong
                    id="movementBalance"
                >
                    0,00 €
                </strong>

            </div>


        </section>


        <!-- =================================================
             FILTROS
        ================================================== -->

        <div class="movement-filters">


            <button
                class="movement-filter active"
                data-filter="all"
                type="button"
            >
                Todos
            </button>


            <button
                class="movement-filter"
                data-filter="income"
                type="button"
            >
                Ingresos
            </button>


            <button
                class="movement-filter"
                data-filter="expense"
                type="button"
            >
                Gastos
            </button>


        </div>


        <!-- =================================================
             LISTA
        ================================================== -->

        <section
            id="movementsList"
            class="movements-list"
        ></section>


    </main>


    <!-- =================================================
         NAVEGACIÓN
    ================================================== -->

    <nav class="bottom-navigation">


        <button
            class="nav-item"
            data-page="dashboard"
            type="button"
        >

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Inicio
            </span>

        </button>


        <button
            class="nav-item active"
            data-page="movements"
            type="button"
        >

            <span class="nav-icon">
                ≡
            </span>

            <span>
                Movimientos
            </span>

        </button>


        <button
            class="nav-item"
            data-page="goals"
            type="button"
        >

            <span class="nav-icon">
                ◎
            </span>

            <span>
                Objetivos
            </span>

        </button>


        <button
            class="nav-item"
            data-page="more"
            type="button"
        >

            <span class="nav-icon">
                •••
            </span>

            <span>
                Más
            </span>

        </button>


    </nav>

<script src="js/nido-storage.js"></script>
<script src="js/movements.js"></script>


</body>

</html>
