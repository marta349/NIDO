<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Configura tu NIDO"
    >

    <title>Configurar NIDO — NIDO</title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <main class="nido-action-page">


        <section class="nido-action-card">


            <!-- LOGO -->

            <div class="auth-logo">
                NIDO
            </div>


            <!-- TIPO SELECCIONADO -->

            <div
                id="selectedTypeIcon"
                class="selected-type-icon"
            >
                ❤️
            </div>


            <h1 id="selectedTypeTitle">
                Pareja
            </h1>


            <p class="auth-description">

                ¿Qué quieres hacer?

            </p>


            <!-- OPCIONES -->

            <div class="nido-actions">


                <!-- CREAR -->

                <button
                    id="createNidoButton"
                    class="nido-action-button"
                    type="button"
                >

                    <span class="nido-action-icon">
                        ＋
                    </span>


                    <span class="nido-action-content">

                        <strong>
                            Crear un NIDO
                        </strong>

                        <small>
                            Crea un espacio nuevo y configura
                            quién puede participar.
                        </small>

                    </span>


                    <span class="nido-option-arrow">
                        →
                    </span>

                </button>


                <!-- UNIRSE -->

                <button
                    id="joinNidoButton"
                    class="nido-action-button"
                    type="button"
                >

                    <span class="nido-action-icon">
                        ↗
                    </span>


                    <span class="nido-action-content">

                        <strong>
                            Unirme a un NIDO
                        </strong>

                        <small>
                            Introduce un código para acceder
                            a un NIDO existente.
                        </small>

                    </span>


                    <span class="nido-option-arrow">
                        →
                    </span>

                </button>


            </div>


            <!-- VOLVER -->

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ← Volver
            </button>


        </section>


    </main>


    <script
        src="js/nido-action.js"
    ></script>


</body>

</html>
