<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Crear una cuenta en NIDO"
    >

    <title>Crear cuenta — NIDO</title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <main class="auth-page">


        <section class="auth-card">


            <!-- VOLVER -->

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ← Volver
            </button>


            <!-- LOGO -->

            <div class="auth-logo">
                NIDO
            </div>


            <!-- TÍTULO -->

            <h1>
                Crear cuenta
            </h1>


            <!-- DESCRIPCIÓN -->

            <p class="auth-description">

                Crea tu cuenta para empezar.

            </p>


            <!-- FORMULARIO -->

            <form
                id="registerForm"
            >


                <!-- NOMBRE -->

                <div class="form-group">

                    <label for="name">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Tu nombre"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="primary-button auth-button"
                >
                    CREAR CUENTA
                </button>


            </form>


            <!-- INICIAR SESIÓN -->

            <p class="account-text">

                ¿Ya tienes una cuenta?

                <button
                    id="loginLink"
                    class="text-button"
                    type="button"
                >
                    Iniciar sesión
                </button>

            </p>


        </section>


    </main>


    <script
        src="js/register.js"
    ></script>


</body>

</html>
