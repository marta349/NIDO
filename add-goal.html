<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo objetivo — NIDO</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="dashboard-page">

    <header class="dashboard-header">

        <div>

            <p class="dashboard-welcome">
                NIDO
            </p>

            <h1>Nuevo objetivo</h1>

        </div>

        <div class="dashboard-logo">
            NIDO
        </div>

    </header>


    <main class="dashboard-content">

        <section class="transaction-page">

            <div class="transaction-card">

                <div class="transaction-icon">
                    🎯
                </div>

                <h2>Crear objetivo</h2>

                <p class="transaction-description">
                    ¿Para qué queréis ahorrar?
                </p>


                <form id="goalForm">

                    <!-- NOMBRE -->

                    <div class="form-group">

                        <label for="goalName">
                            Nombre del objetivo
                        </label>

                        <input
                            type="text"
                            id="goalName"
                            placeholder="Ej. Viaje a París"
                            required
                        >

                    </div>


                    <!-- CANTIDAD OBJETIVO -->

                    <div class="form-group">

                        <label for="goalTarget">
                            Cantidad objetivo
                        </label>

                        <div class="amount-input">

                            <input
                                type="number"
                                id="goalTarget"
                                placeholder="2000"
                                min="0.01"
                                step="0.01"
                                required
                            >

                            <span>€</span>

                        </div>

                    </div>


                    <!-- CANTIDAD AHORRADA -->

                    <div class="form-group">

                        <label for="goalSaved">
                            Cantidad ahorrada actualmente
                        </label>

                        <div class="amount-input">

                            <input
                                type="number"
                                id="goalSaved"
                                placeholder="500"
                                min="0"
                                step="0.01"
                                value="0"
                                required
                            >

                            <span>€</span>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Crear objetivo
                    </button>


                    <button
                        type="button"
                        id="backButton"
                        class="secondary-button"
                    >
                        Cancelar
                    </button>

                </form>

            </div>

        </section>

    </main>

<script src="js/nido-storage.js"></script>
<script src="js/add-goal.js"></script>

</body>

</html>
